<svg xmlns="http://www.w3.org/2000/svg" width="248" height="56" viewBox="0 0 248 56" role="img" aria-label="Join the Discord">
<title>Join the Discord</title>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.sh{transform:translateX(-80px);animation:sh 4s ease-in-out 0s infinite}
@keyframes sh{0%{transform:translateX(-80px)}35%,100%{transform:translateX(288px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5865f2"/><stop offset="1" stop-color="#4752c4"/></linearGradient>
<linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="246" height="54" rx="12"/></clipPath>
</defs>
<rect x="1" y="1" width="246" height="54" rx="12" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".18"/>
<g clip-path="url(#c)"><rect class="sh" x="0" y="0" width="60" height="56" fill="url(#gl)" transform="skewX(-20)"/></g>
<g transform="translate(20 16.0)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><circle cx="8" cy="10.5" r=".6" fill="#fff"/><circle cx="12" cy="10.5" r=".6" fill="#fff"/><circle cx="16" cy="10.5" r=".6" fill="#fff"/></g>
<text class="s" x="58" y="25" font-size="16" font-weight="700" fill="#fff">Join the Discord</text>
<text class="s" x="58" y="42" font-size="11.5" fill="#fff" fill-opacity=".8">chat with the community</text>
<path d="M220 22.0 l6 6 -6 6" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
