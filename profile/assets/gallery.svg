<rect width="840" height="230" fill="#0d1117"/>
<text class="s" x="28" y="38" font-size="17" font-weight="600" fill="#e6edf3">Hello World Gallery</text><text class="s" x="812" y="38" font-size="13" fill="#8b949e" text-anchor="end">one short program per domain, kept working forever</text>
<rect x="28" y="62" width="784" height="104" rx="8" fill="#010409" stroke="#30363d"/>
<g class="i0"><text class="s" x="48" y="92" font-size="12" font-weight="700" letter-spacing="1.2" fill="#58a6ff">CONSOLE</text><rect x="690" y="78" width="102" height="22" rx="11" fill="#0f2d1a" stroke="#238636"/><text class="s" x="741.0" y="93" font-size="12" fill="#3fb950" text-anchor="middle">✓ runs today</text><text class="m" x="48" y="137" font-size="14.5" xml:space="preserve"><tspan fill="#e6edf3">print(</tspan><tspan fill="#a5d6ff">&quot;Hello, World!&quot;</tspan><tspan fill="#e6edf3">)</tspan></text></g>
<circle class="d0" cx="330.0" cy="190" r="4" fill="#58a6ff"/>
<g class="i1"><text class="s" x="48" y="92" font-size="12" font-weight="700" letter-spacing="1.2" fill="#58a6ff">CLI TOOL</text><rect x="690" y="78" width="102" height="22" rx="11" fill="#161b22" stroke="#30363d"/><text class="s" x="741.0" y="93" font-size="12" fill="#8b949e" text-anchor="middle">planned · M8</text><text class="m" x="48" y="137" font-size="14.5" xml:space="preserve"><tspan fill="#8b949e">[Command]</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#ff7b72">void</tspan><tspan fill="#e6edf3"> Greet(</tspan><tspan fill="#ff7b72">string</tspan><tspan fill="#e6edf3"> name = </tspan><tspan fill="#a5d6ff">&quot;World&quot;</tspan><tspan fill="#e6edf3">) =&gt; print(</tspan><tspan fill="#a5d6ff">$&quot;Hello, {name}!&quot;</tspan><tspan fill="#e6edf3">)</tspan></text></g>
<circle class="d1" cx="348.0" cy="190" r="4" fill="#484f58"/>
<g class="i2"><text class="s" x="48" y="92" font-size="12" font-weight="700" letter-spacing="1.2" fill="#58a6ff">WINDOW</text><rect x="690" y="78" width="102" height="22" rx="11" fill="#161b22" stroke="#30363d"/><text class="s" x="741.0" y="93" font-size="12" fill="#8b949e" text-anchor="middle">planned · M8</text><text class="m" x="48" y="125" font-size="14.5" xml:space="preserve"><tspan fill="#ff7b72">use</tspan><tspan fill="#e6edf3"> envo.ui;</tspan></text><text class="m" x="48" y="149" font-size="14.5" xml:space="preserve"><tspan fill="#e6edf3">window(</tspan><tspan fill="#a5d6ff">&quot;Hello&quot;</tspan><tspan fill="#e6edf3">) { Text(</tspan><tspan fill="#a5d6ff">&quot;Hello, World!&quot;</tspan><tspan fill="#e6edf3">) }</tspan></text></g>
<circle class="d2" cx="366.0" cy="190" r="4" fill="#484f58"/>
<g class="i3"><text class="s" x="48" y="92" font-size="12" font-weight="700" letter-spacing="1.2" fill="#58a6ff">WEBSITE</text><rect x="690" y="78" width="102" height="22" rx="11" fill="#161b22" stroke="#30363d"/><text class="s" x="741.0" y="93" font-size="12" fill="#8b949e" text-anchor="middle">planned · M9</text><text class="m" x="48" y="125" font-size="14.5" xml:space="preserve"><tspan fill="#ff7b72">use</tspan><tspan fill="#e6edf3"> envo.web;</tspan></text><text class="m" x="48" y="149" font-size="14.5" xml:space="preserve"><tspan fill="#e6edf3">site(</tspan><tspan fill="#a5d6ff">&quot;Hello&quot;</tspan><tspan fill="#e6edf3">) { page(</tspan><tspan fill="#a5d6ff">&quot;/&quot;</tspan><tspan fill="#e6edf3">) =&gt; Landing(title: </tspan><tspan fill="#a5d6ff">&quot;Hello, World!&quot;</tspan><tspan fill="#e6edf3">) }</tspan></text></g>
<circle class="d3" cx="384.0" cy="190" r="4" fill="#484f58"/>
