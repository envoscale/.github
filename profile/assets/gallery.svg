<g class="i10"><text class="s" x="48" y="92" font-size="12" font-weight="700" letter-spacing="1.2" fill="#58a6ff">SYSTEMS</text><rect x="690" y="78" width="102" height="22" rx="11" fill="#161b22" stroke="#30363d"/><text class="s" x="741.0" y="93" font-size="12" fill="#8b949e" text-anchor="middle">planned · M3</text><text class="m" x="48" y="137" font-size="14.5" xml:space="preserve"><tspan fill="#8b949e">[NoAlloc]</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#ff7b72">extern</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#a5d6ff">&quot;C&quot;</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#ff7b72">int</tspan><tspan fill="#e6edf3"> main() { </tspan><tspan fill="#ff7b72">unsafe</tspan><tspan fill="#e6edf3"> { </tspan><tspan fill="#ff7b72">asm</tspan><tspan fill="#e6edf3"> x86_64 { /* … */ } } </tspan><tspan fill="#ff7b72">return</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#ffa657">0</tspan><tspan fill="#e6edf3">; }</tspan></text></g>
