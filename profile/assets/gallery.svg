<circle class="d8" cx="474.0" cy="190" r="4" fill="#484f58"/>
<g class="i9"><text class="s" x="48" y="92" font-size="12" font-weight="700" letter-spacing="1.2" fill="#58a6ff">AI</text><rect x="683" y="78" width="109" height="22" rx="11" fill="#161b22" stroke="#30363d"/><text class="s" x="737.5" y="93" font-size="12" fill="#8b949e" text-anchor="middle">planned · M12</text><text class="m" x="48" y="125" font-size="14.5" xml:space="preserve"><tspan fill="#ff7b72">use</tspan><tspan fill="#e6edf3"> envo.ai;</tspan></text><text class="m" x="48" y="149" font-size="14.5" xml:space="preserve"><tspan fill="#e6edf3">print(ai.Load(</tspan><tspan fill="#a5d6ff">&quot;tiny.gguf&quot;</tspan><tspan fill="#e6edf3">).Ask(</tspan><tspan fill="#a5d6ff">&quot;Say hello&quot;</tspan><tspan fill="#e6edf3">))</tspan></text></g>
