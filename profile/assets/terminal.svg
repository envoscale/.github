<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" role="img" aria-labelledby="t d">
<title id="t">envoc0 compiling Hello World</title>
<desc id="d">A terminal types: cat hello.envo, which prints print(&quot;Hello, World!&quot;); envoc0 build hello.envo -o hello --target x86_64-linux; ls -l hello, which shows 1277 bytes; ./hello, which prints Hello, World!</desc>
