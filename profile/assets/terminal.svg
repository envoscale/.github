<text class="s" x="420.0" y="25" font-size="13" fill="#8b949e" text-anchor="middle">envoc0: Stage 0, the compiler written in assembly</text>
<g class="all">
<text class="m" x="28" y="74" font-size="15" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">cat hello.envo</tspan></text>
<g class="c0"><rect x="28" y="56" width="840" height="26" fill="#0d1117"/><rect class="c0c" x="28" y="59" width="9" height="19" fill="#58a6ff"/></g>
<text class="m o1" x="28" y="101" font-size="15" textLength="198" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#d2a8ff">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">&quot;Hello, World!&quot;</tspan><tspan fill="#e6edf3">)</tspan></text>
<text class="m" x="28" y="128" font-size="15" textLength="504" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">envoc0 build hello.envo -o hello --target x86_64-linux</tspan></text>
<g class="c2"><rect x="28" y="110" width="840" height="26" fill="#0d1117"/><rect class="c2c" x="28" y="113" width="9" height="19" fill="#58a6ff"/></g>
<text class="m" x="28" y="155" font-size="15" textLength="117" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">ls -l hello</tspan></text>
<g class="c3"><rect x="28" y="137" width="840" height="26" fill="#0d1117"/><rect class="c3c" x="28" y="140" width="9" height="19" fill="#58a6ff"/></g>
<text class="m o4" x="28" y="182" font-size="15" textLength="315" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">-rwxr-xr-x  1 dev  dev  </tspan><tspan fill="#ffa657">1277</tspan><tspan fill="#8b949e">  hello</tspan></text>
<text class="m" x="28" y="209" font-size="15" textLength="81" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">./hello</tspan></text>
<g class="c5"><rect x="28" y="191" width="840" height="26" fill="#0d1117"/><rect class="c5c" x="28" y="194" width="9" height="19" fill="#58a6ff"/></g>
<text class="m o6" x="28" y="236" font-size="15" textLength="117" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#3fb950">Hello, World!</tspan></text>
<text class="m o7" x="28" y="263" font-size="15" textLength="18" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">$ </tspan></text>
<g class="o7"><rect class="blink" x="46.0" y="248" width="9" height="19" fill="#58a6ff"/></g>
<g class="cap"><line x1="28" y1="284" x2="812" y2="284" stroke="#30363d"/><text class="s" x="28" y="310" font-size="13" fill="#8b949e"><tspan fill="#ffa657" font-weight="600">1,277 bytes</tspan> of ELF · no libc · no linker · built by a compiler written in <tspan fill="#e6edf3" font-weight="600">15k lines of x86-64 assembly</tspan></text></g>
</g>
</g>
