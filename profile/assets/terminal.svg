<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-labelledby="t d">
<title id="t">An envo session</title>
<desc id="d">A terminal types: envo new greet, which creates a package; envo run greet, which prints Hello, greet!; envo test greet, 4 passed, 0 failed; envo build greet --target aarch64-macos, which builds a signed Mach-O for Apple silicon; envo fmt --check and envo check.</desc>
<style>
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.all{animation:fade 16.0s linear infinite}@keyframes fade{0%,95.625%{opacity:1}98.75%,100%{opacity:0}}
.c0{transform:translateX(144px);animation:c0 16.0s linear infinite}@keyframes c0{0%{transform:translateX(0);animation-timing-function:step-end}1.25%{transform:translateX(18px)}3.125%{transform:translateX(18px);animation-timing-function:steps(14,end)}8.75%,100%{transform:translateX(144px)}}
.c0c{opacity:0;animation:c0c 16.0s step-end infinite}@keyframes c0c{0%{opacity:0}1.25%{opacity:1}9.375%,100%{opacity:0}}
.o1{animation:o1 16.0s step-end infinite}@keyframes o1{0%{opacity:0}11.25%,100%{opacity:1}}
.c2{transform:translateX(144px);animation:c2 16.0s linear infinite}@keyframes c2{0%{transform:translateX(0);animation-timing-function:step-end}14.375%{transform:translateX(18px)}16.25%{transform:translateX(18px);animation-timing-function:steps(14,end)}21.875%,100%{transform:translateX(144px)}}
.c2c{opacity:0;animation:c2c 16.0s step-end infinite}@keyframes c2c{0%{opacity:0}14.375%{opacity:1}22.5%,100%{opacity:0}}
.o3{animation:o3 16.0s step-end infinite}@keyframes o3{0%{opacity:0}24.375%,100%{opacity:1}}
.c4{transform:translateX(153px);animation:c4 16.0s linear infinite}@keyframes c4{0%{transform:translateX(0);animation-timing-function:step-end}27.5%{transform:translateX(18px)}29.375%{transform:translateX(18px);animation-timing-function:steps(15,end)}35.625%,100%{transform:translateX(153px)}}
.c4c{opacity:0;animation:c4c 16.0s step-end infinite}@keyframes c4c{0%{opacity:0}27.5%{opacity:1}37.5%,100%{opacity:0}}
.o5{animation:o5 16.0s step-end infinite}@keyframes o5{0%{opacity:0}39.375%,100%{opacity:1}}
.c6{transform:translateX(369px);animation:c6 16.0s linear infinite}@keyframes c6{0%{transform:translateX(0);animation-timing-function:step-end}42.5%{transform:translateX(18px)}44.375%{transform:translateX(18px);animation-timing-function:steps(39,end)}57.5%,100%{transform:translateX(369px)}}
.c6c{opacity:0;animation:c6c 16.0s step-end infinite}@keyframes c6c{0%{opacity:0}42.5%{opacity:1}58.75%,100%{opacity:0}}
.o7{animation:o7 16.0s step-end infinite}@keyframes o7{0%{opacity:0}60.625%,100%{opacity:1}}
.c8{transform:translateX(396px);animation:c8 16.0s linear infinite}@keyframes c8{0%{transform:translateX(0);animation-timing-function:step-end}63.75%{transform:translateX(18px)}65.625%{transform:translateX(18px);animation-timing-function:steps(42,end)}76.25%,100%{transform:translateX(396px)}}
.c8c{opacity:0;animation:c8c 16.0s step-end infinite}@keyframes c8c{0%{opacity:0}63.75%{opacity:1}77.5%,100%{opacity:0}}
.o9{animation:o9 16.0s step-end infinite}@keyframes o9{0%{opacity:0}79.375%,100%{opacity:1}}
.blink{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
.cap{animation:cap 16.0s linear infinite}@keyframes cap{0%,82.5%{opacity:0;transform:translateY(6px)}85.625%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><clipPath id="card"><rect width="840" height="400" rx="12"/></clipPath></defs>
<g clip-path="url(#card)">
<rect width="840" height="400" fill="#0d1117"/>
<rect width="840" height="40" fill="#161b22"/><line x1="0" y1="40.5" x2="840" y2="40.5" stroke="#30363d"/>
<circle cx="24" cy="20" r="6" fill="#ff5f57"/>
<circle cx="44" cy="20" r="6" fill="#febc2e"/>
<circle cx="64" cy="20" r="6" fill="#28c840"/>
<text class="s" x="420.0" y="25" font-size="13" fill="#8b949e" text-anchor="middle">envo: one tool to create, run, test and build</text>
<g class="all">
<text class="m" x="28" y="72" font-size="15" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">envo new greet</tspan></text>
<g class="c0"><rect x="28" y="54" width="840" height="26" fill="#0d1117"/><rect class="c0c" x="28" y="57" width="9" height="19" fill="#58a6ff"/></g>
<text class="m o1" x="28" y="99" font-size="15" textLength="666" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">created package </tspan><tspan fill="#e6edf3">greet</tspan><tspan fill="#8b949e">: envo.envon, main.envol, greet.envol, tests/greet.envol</tspan></text>
<text class="m" x="28" y="126" font-size="15" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">envo run greet</tspan></text>
<g class="c2"><rect x="28" y="108" width="840" height="26" fill="#0d1117"/><rect class="c2c" x="28" y="111" width="9" height="19" fill="#58a6ff"/></g>
<text class="m o3" x="28" y="153" font-size="15" textLength="117" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#3fb950">Hello, greet!</tspan></text>
<text class="m" x="28" y="180" font-size="15" textLength="153" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">envo test greet</tspan></text>
<g class="c4"><rect x="28" y="162" width="840" height="26" fill="#0d1117"/><rect class="c4c" x="28" y="165" width="9" height="19" fill="#58a6ff"/></g>
<text class="m o5" x="28" y="207" font-size="15" textLength="162" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#3fb950">4 passed</tspan><tspan fill="#8b949e">, 0 failed</tspan></text>
<text class="m" x="28" y="234" font-size="15" textLength="369" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">envo build greet --target aarch64-macos</tspan></text>
<g class="c6"><rect x="28" y="216" width="840" height="26" fill="#0d1117"/><rect class="c6c" x="28" y="219" width="9" height="19" fill="#58a6ff"/></g>
<text class="m o7" x="28" y="261" font-size="15" textLength="549" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">built </tspan><tspan fill="#e6edf3">greet/build/greet</tspan><tspan fill="#484f58">   # a signed Mach-O for Apple silicon</tspan></text>
<text class="m" x="28" y="288" font-size="15" textLength="396" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">envo fmt --check greet &amp;&amp; envo check greet</tspan></text>
<g class="c8"><rect x="28" y="270" width="840" height="26" fill="#0d1117"/><rect class="c8c" x="28" y="273" width="9" height="19" fill="#58a6ff"/></g>
<text class="m o9" x="28" y="315" font-size="15" textLength="18" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e">$ </tspan></text>
<g class="o9"><rect class="blink" x="46.0" y="300" width="9" height="19" fill="#58a6ff"/></g>
<g class="cap"><line x1="28" y1="354" x2="812" y2="354" stroke="#30363d"/><text class="s" x="28" y="380" font-size="13" fill="#8b949e">Packages, tests, formatter, checker, debugger, profiler, fuzzer, language server, signed packages: <tspan fill="#e6edf3" font-weight="600">all one binary, all written in Envo</tspan></text></g>
</g>
</g>
<rect x="0.5" y="0.5" width="839" height="399" rx="12" fill="none" stroke="#30363d"/>
</svg>
