.c3c{opacity:0;animation:c3c 14.0s step-end infinite}@keyframes c3c{0%{opacity:0}37.143%{opacity:1}45.714%,100%{opacity:0}}
.o4{animation:o4 14.0s step-end infinite}@keyframes o4{0%{opacity:0}47.857%,100%{opacity:1}}
