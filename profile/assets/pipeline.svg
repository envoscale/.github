<text class="s" x="322.0" y="262" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle">379</text><text class="s" x="322.0" y="282" font-size="12" fill="#8b949e" text-anchor="middle">spec programs</text>
<text class="s" x="518.0" y="262" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle">739 / 739</text><text class="s" x="518.0" y="282" font-size="12" fill="#8b949e" text-anchor="middle">tests, Windows + Linux</text>
<text class="s" x="714.0" y="262" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle">0</text><text class="s" x="714.0" y="282" font-size="12" fill="#8b949e" text-anchor="middle">third-party libraries</text>
