</style>
<defs><clipPath id="card"><rect width="840" height="300" rx="12"/></clipPath></defs>
<g clip-path="url(#card)">
<rect width="840" height="300" fill="#0d1117"/>
<text class="s" x="28" y="38" font-size="17" font-weight="600" fill="#e6edf3">Inside envoc1</text><text class="s" x="812" y="38" font-size="13" fill="#8b949e" text-anchor="end">written in Envo-Core, checked against envoc0 on every test</text>
<rect x="21.0" y="70" width="118" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect class="h0" x="21.0" y="70" width="118" height="44" rx="8" fill="#0b2440" stroke="#58a6ff" stroke-width="1.5"/>
<text class="s" x="80.0" y="97" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Source</text>
<g class="s0"><rect x="21.0" y="128" width="118" height="78" rx="6" fill="#010409" stroke="#30363d"/>
<text class="m" x="30.0" y="151" font-size="11.5" fill="#d2a8ff" xml:space="preserve">print(</text>
<text class="m" x="30.0" y="172" font-size="11.5" fill="#a5d6ff" xml:space="preserve">&quot;Hello,</text>
<text class="m" x="30.0" y="193" font-size="11.5" fill="#a5d6ff" xml:space="preserve"> World!&quot;)</text>
</g>
