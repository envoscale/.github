<text class="s" x="216.0" y="97" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Tokens</text>
<g class="s1"><rect x="157.0" y="128" width="118" height="78" rx="6" fill="#010409" stroke="#30363d"/>
<text class="m" x="166.0" y="151" font-size="11.5" fill="#e6edf3" xml:space="preserve">ident print</text>
<text class="m" x="166.0" y="172" font-size="11.5" fill="#8b949e" xml:space="preserve">punct (</text>
<text class="m" x="166.0" y="193" font-size="11.5" fill="#a5d6ff" xml:space="preserve">string &quot;Hel…&quot;</text>
</g>
<path d="M277.0 92.0 L287.0 92.0" stroke="#484f58" stroke-width="1.5"/><path d="M286.0 88.0 L291.0 92.0 L286.0 96.0 Z" fill="#484f58"/>
