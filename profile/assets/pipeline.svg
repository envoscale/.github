<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="t d">
<title id="t">The envoc1 compiler pipeline</title>
<desc id="d">Source, tokens, syntax tree, EIR, x86-64, executable (PE32+ for Windows, ELF64 for Linux), each shown with the Hello World program at that stage.</desc>
