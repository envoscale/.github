<text class="s" x="352.0" y="97" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Syntax tree</text>
<g class="s2"><rect x="293.0" y="128" width="118" height="78" rx="6" fill="#010409" stroke="#30363d"/>
<text class="m" x="302.0" y="151" font-size="11.5" fill="#e6edf3" xml:space="preserve">expr</text>
<text class="m" x="302.0" y="172" font-size="11.5" fill="#d2a8ff" xml:space="preserve">└ call</text>
<text class="m" x="302.0" y="193" font-size="11.5" fill="#8b949e" xml:space="preserve">  └ name print</text>
</g>
<path d="M413.0 92.0 L423.0 92.0" stroke="#484f58" stroke-width="1.5"/><path d="M422.0 88.0 L427.0 92.0 L422.0 96.0 Z" fill="#484f58"/>
<rect x="429.0" y="70" width="118" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect class="h3" x="429.0" y="70" width="118" height="44" rx="8" fill="#0b2440" stroke="#58a6ff" stroke-width="1.5"/>
<text class="s" x="488.0" y="97" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">EIR</text>
<g class="s3"><rect x="429.0" y="128" width="118" height="78" rx="6" fill="#010409" stroke="#30363d"/>
<text class="m" x="438.0" y="151" font-size="11.5" fill="#e6edf3" xml:space="preserve">%2 = addr @str</text>
<text class="m" x="438.0" y="172" font-size="11.5" fill="#8b949e" xml:space="preserve">copy %1, %0, 16</text>
<text class="m" x="438.0" y="193" font-size="11.5" fill="#d2a8ff" xml:space="preserve">call @__rt_print</text>
</g>
<path d="M549.0 92.0 L559.0 92.0" stroke="#484f58" stroke-width="1.5"/><path d="M558.0 88.0 L563.0 92.0 L558.0 96.0 Z" fill="#484f58"/>
<rect x="565.0" y="70" width="118" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect class="h4" x="565.0" y="70" width="118" height="44" rx="8" fill="#0b2440" stroke="#58a6ff" stroke-width="1.5"/>
<text class="s" x="624.0" y="97" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">x86-64</text>
<g class="s4"><rect x="565.0" y="128" width="118" height="78" rx="6" fill="#010409" stroke="#30363d"/>
<text class="m" x="574.0" y="151" font-size="11.5" fill="#8b949e" xml:space="preserve">call __rt_init</text>
<text class="m" x="574.0" y="172" font-size="11.5" fill="#e6edf3" xml:space="preserve">call __main</text>
<text class="m" x="574.0" y="193" font-size="11.5" fill="#8b949e" xml:space="preserve">call __rt_exit</text>
</g>
