.h3{opacity:0;animation:h3 9.0s ease-out infinite}@keyframes h3{0%,40%{opacity:0}41.667%{opacity:1}55.556%{opacity:.35}92.222%{opacity:.35}97.778%,100%{opacity:0}}
.s3{animation:s3 9.0s ease-out infinite}@keyframes s3{0%,40%{opacity:0;transform:translateY(-6px)}44.444%,92.222%{opacity:1;transform:none}97.778%,100%{opacity:0}}
.h4{opacity:0;animation:h4 9.0s ease-out infinite}@keyframes h4{0%,52.222%{opacity:0}53.889%{opacity:1}67.778%{opacity:.35}92.222%{opacity:.35}97.778%,100%{opacity:0}}
