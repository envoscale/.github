<svg xmlns="http://www.w3.org/2000/svg" width="144" height="44" viewBox="0 0 144 44" role="img" aria-label="Roadmap">
<title>Roadmap</title>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.sh{transform:translateX(-80px);animation:sh 4s ease-in-out 2s infinite}
@keyframes sh{0%{transform:translateX(-80px)}35%,100%{transform:translateX(184px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f8bff"/><stop offset="1" stop-color="#0a6fd6"/></linearGradient>
<linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="142" height="42" rx="10"/></clipPath>
</defs>
<rect x="1" y="1" width="142" height="42" rx="10" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".18"/>
<g clip-path="url(#c)"><rect class="sh" x="0" y="0" width="50" height="44" fill="url(#gl)" transform="skewX(-20)"/></g>
<g transform="translate(14 12.0) scale(.84)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M8.5 3v18M15.5 3v18"/><path d="M4.5 7h2M11 7h2M11 11h2M18 7h2" stroke-width="2.4"/></g>
<text class="s" x="42" y="27.0" font-size="15" font-weight="700" fill="#fff">Roadmap</text>
<path d="M127 17.5 l4.5 4.5 -4.5 4.5" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
