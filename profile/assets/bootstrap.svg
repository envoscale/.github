<circle class="p0" cx="158.0" cy="144.0" r="4" fill="#e6edf3"/>
<rect x="185.0" y="92" width="136" height="104" rx="10" fill="#0b2440" stroke="#0a7aeb" stroke-width="1.5"/>
<rect class="g1" x="182.0" y="89" width="142" height="110" rx="12" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
<text class="s" x="253.0" y="122" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Stage 0</text>
<text class="m" x="253.0" y="148" font-size="13" fill="#58a6ff" text-anchor="middle">envoc0</text>
<text class="s" x="253.0" y="172" font-size="12" fill="#8b949e" text-anchor="middle">x86-64 assembly</text>
<g><rect x="223.0" y="214" width="60" height="22" rx="11" fill="#0f2d1a" stroke="#238636"/><text class="s" x="253.0" y="229" font-size="12" fill="#3fb950" text-anchor="middle">✓ done</text></g>
<line x1="325.0" y1="144.0" x2="343.0" y2="144.0" stroke="#58a6ff" stroke-width="2"/><path d="M342.0 139.0 L348.0 144.0 L342.0 149.0 Z" fill="#58a6ff"/>
<circle class="p1" cx="325.0" cy="144.0" r="4" fill="#e6edf3"/>
<rect x="352.0" y="92" width="136" height="104" rx="10" fill="#0b2440" stroke="#0a7aeb" stroke-width="1.5"/>
<rect class="g2" x="349.0" y="89" width="142" height="110" rx="12" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
<text class="s" x="420.0" y="122" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Stage 1</text>
<text class="m" x="420.0" y="148" font-size="13" fill="#58a6ff" text-anchor="middle">envoc1</text>
<text class="s" x="420.0" y="172" font-size="12" fill="#8b949e" text-anchor="middle">Envo-Core</text>
<g><rect x="390.0" y="214" width="60" height="22" rx="11" fill="#0f2d1a" stroke="#238636"/><text class="s" x="420.0" y="229" font-size="12" fill="#3fb950" text-anchor="middle">✓ done</text></g>
<line x1="492.0" y1="144.0" x2="510.0" y2="144.0" stroke="#58a6ff" stroke-width="2"/><path d="M509.0 139.0 L515.0 144.0 L509.0 149.0 Z" fill="#58a6ff"/>
<circle class="p2" cx="492.0" cy="144.0" r="4" fill="#e6edf3"/>
<rect x="519.0" y="92" width="136" height="104" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<rect class="g3" x="516.0" y="89" width="142" height="110" rx="12" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
<text class="s" x="587.0" y="122" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Stage 2</text>
<text class="m" x="587.0" y="148" font-size="13" fill="#58a6ff" text-anchor="middle">envoc</text>
<text class="s" x="587.0" y="172" font-size="12" fill="#8b949e" text-anchor="middle">Envo-S1</text>
<g class="pulse"><rect x="532.5" y="214" width="109" height="22" rx="11" fill="#0b2440" stroke="#0a7aeb"/><text class="s" x="587.0" y="229" font-size="12" fill="#58a6ff" text-anchor="middle">● in progress</text></g>
<line x1="659.0" y1="144.0" x2="677.0" y2="144.0" stroke="#484f58" stroke-width="2" stroke-dasharray="3 3"/><path d="M676.0 139.0 L682.0 144.0 L676.0 149.0 Z" fill="#484f58"/>
<rect x="686.0" y="92" width="136" height="104" rx="10" fill="#161b22" stroke="#484f58" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="s" x="754.0" y="122" font-size="15" font-weight="600" fill="#8b949e" text-anchor="middle">Fixed point</text>
<text class="m" x="754.0" y="148" font-size="13" fill="#8b949e" text-anchor="middle">A == B</text>
<text class="s" x="754.0" y="172" font-size="12" fill="#8b949e" text-anchor="middle">byte-identical</text>
<g><rect x="703.0" y="214" width="102" height="22" rx="11" fill="#161b22" stroke="#30363d"/><text class="s" x="754.0" y="229" font-size="12" fill="#8b949e" text-anchor="middle">planned · M3</text></g>
<path d="M587.0 88 C587.0 58,754.0 58,754.0 84" fill="none" stroke="#484f58" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M749.0 79 L754.0 87 L759.0 79" fill="none" stroke="#484f58" stroke-width="1.5"/><text class="s" x="670.5" y="62" font-size="11" fill="#8b949e" text-anchor="middle">envoc builds envoc, twice</text>
<text class="s" x="28" y="278" font-size="13" fill="#8b949e">CI rebuilds the ladder on Windows and Linux and checks that both hosts produce <tspan fill="#e6edf3">the same bytes</tspan>.</text>
</g>
<rect x="0.5" y="0.5" width="839" height="299" rx="12" fill="none" stroke="#30363d"/>
</svg>
