<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="t d">
<title id="t">The EnvoScale bootstrap ladder</title>
<desc id="d">Seed (NASM today, a hex seed in M13), then Stage 0 envoc0 in x86-64 assembly (done), Stage 1 envoc1 in Envo-Core (done), Stage 2 envoc in Envo-S1 (in progress, M3), and the fixed point where envoc built twice gives byte-identical output (planned, M3).</desc>
<style>
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.g0{opacity:0;animation:g0 7.0s ease-out infinite}@keyframes g0{0%,0%{opacity:0}2.143%{opacity:.9}17.143%,100%{opacity:0}}
.p0{opacity:0;animation:p0 7.0s ease-in-out infinite}@keyframes p0{0%,2.857%{opacity:0;transform:translateX(0)}4.286%{opacity:1}13.571%{opacity:1;transform:translateX(19px)}15%,100%{opacity:0;transform:translateX(19px)}}
.g1{opacity:0;animation:g1 7.0s ease-out infinite}@keyframes g1{0%,14.286%{opacity:0}16.429%{opacity:.9}31.429%,100%{opacity:0}}
.p1{opacity:0;animation:p1 7.0s ease-in-out infinite}@keyframes p1{0%,17.143%{opacity:0;transform:translateX(0)}18.571%{opacity:1}27.857%{opacity:1;transform:translateX(19px)}29.286%,100%{opacity:0;transform:translateX(19px)}}
.g2{opacity:0;animation:g2 7.0s ease-out infinite}@keyframes g2{0%,28.571%{opacity:0}30.714%{opacity:.9}45.714%,100%{opacity:0}}
.p2{opacity:0;animation:p2 7.0s ease-in-out infinite}@keyframes p2{0%,31.429%{opacity:0;transform:translateX(0)}32.857%{opacity:1}42.143%{opacity:1;transform:translateX(19px)}43.571%,100%{opacity:0;transform:translateX(19px)}}
.g3{opacity:0;animation:g3 7.0s ease-out infinite}@keyframes g3{0%,42.857%{opacity:0}45%{opacity:.9}60%,100%{opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><clipPath id="card"><rect width="840" height="300" rx="12"/></clipPath></defs>
<g clip-path="url(#card)">
<rect width="840" height="300" fill="#0d1117"/>
<text class="s" x="28" y="38" font-size="17" font-weight="600" fill="#e6edf3">The bootstrap ladder</text><text class="s" x="812" y="38" font-size="13" fill="#8b949e" text-anchor="end">each compiler is built, from source, by the one before it</text>
<rect x="18.0" y="92" width="136" height="104" rx="10" fill="#0b2440" stroke="#0a7aeb" stroke-width="1.5"/>
<rect class="g0" x="15.0" y="89" width="142" height="110" rx="12" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
<text class="s" x="86.0" y="122" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Seed</text>
<text class="m" x="86.0" y="148" font-size="13" fill="#58a6ff" text-anchor="middle">NASM today</text>
<text class="s" x="86.0" y="172" font-size="12" fill="#8b949e" text-anchor="middle">hex seed · M13</text>
<g><rect x="56.0" y="214" width="60" height="22" rx="11" fill="#0f2d1a" stroke="#238636"/><text class="s" x="86.0" y="229" font-size="12" fill="#3fb950" text-anchor="middle">✓ done</text></g>
