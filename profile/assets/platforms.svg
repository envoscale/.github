<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-labelledby="t d">
<title id="t">Platforms EnvoScale runs on</title>
<desc id="d">Windows x86-64, Linux x86-64, Linux arm64, macOS on Apple silicon (signed Mach-O) and the browser (WebAssembly, where the compiler itself also runs). All are built and tested in CI on every change.</desc>
<style>
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.p0{animation:p0 6.0s ease-out infinite}@keyframes p0{0%,5%{opacity:0;transform:scale(.6)}9.167%{opacity:1;transform:scale(1.15)}12.5%,100%{opacity:1;transform:none}}
.p1{animation:p1 6.0s ease-out infinite}@keyframes p1{0%,10.833%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.15)}18.333%,100%{opacity:1;transform:none}}
.p2{animation:p2 6.0s ease-out infinite}@keyframes p2{0%,16.667%{opacity:0;transform:scale(.6)}20.833%{opacity:1;transform:scale(1.15)}24.167%,100%{opacity:1;transform:none}}
.p3{animation:p3 6.0s ease-out infinite}@keyframes p3{0%,22.5%{opacity:0;transform:scale(.6)}26.667%{opacity:1;transform:scale(1.15)}30%,100%{opacity:1;transform:none}}
.p4{animation:p4 6.0s ease-out infinite}@keyframes p4{0%,28.333%{opacity:0;transform:scale(.6)}32.5%{opacity:1;transform:scale(1.15)}35.833%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><clipPath id="card"><rect width="840" height="250" rx="12"/></clipPath></defs>
<g clip-path="url(#card)">
<rect width="840" height="250" fill="#0d1117"/>
<text class="s" x="28" y="38" font-size="17" font-weight="600" fill="#e6edf3">Runs on</text><text class="s" x="812" y="38" font-size="13" fill="#8b949e" text-anchor="end">every target is built and run in CI on every change</text>
<rect x="30.0" y="66" width="148" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<g class="p0" style="transform-box:fill-box;transform-origin:center"><circle cx="104.0" cy="96" r="13" fill="#0f2d1a" stroke="#238636"/><path d="M98.0 96 l4 4 l8 -8" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="s" x="104.0" y="132" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Windows</text>
<text class="m" x="104.0" y="152" font-size="12.5" fill="#58a6ff" text-anchor="middle">x86-64</text>
<text class="s" x="104.0" y="172" font-size="11.5" fill="#8b949e" text-anchor="middle">PE · W^X · ASLR</text>
<rect x="188.0" y="66" width="148" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<g class="p1" style="transform-box:fill-box;transform-origin:center"><circle cx="262.0" cy="96" r="13" fill="#0f2d1a" stroke="#238636"/><path d="M256.0 96 l4 4 l8 -8" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="s" x="262.0" y="132" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Linux</text>
<text class="m" x="262.0" y="152" font-size="12.5" fill="#58a6ff" text-anchor="middle">x86-64</text>
<text class="s" x="262.0" y="172" font-size="11.5" fill="#8b949e" text-anchor="middle">ELF · W^X · ASLR</text>
<rect x="346.0" y="66" width="148" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<g class="p2" style="transform-box:fill-box;transform-origin:center"><circle cx="420.0" cy="96" r="13" fill="#0f2d1a" stroke="#238636"/><path d="M414.0 96 l4 4 l8 -8" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="s" x="420.0" y="132" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Linux</text>
<text class="m" x="420.0" y="152" font-size="12.5" fill="#58a6ff" text-anchor="middle">arm64</text>
<text class="s" x="420.0" y="172" font-size="11.5" fill="#8b949e" text-anchor="middle">ELF · new in M10</text>
<rect x="504.0" y="66" width="148" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<g class="p3" style="transform-box:fill-box;transform-origin:center"><circle cx="578.0" cy="96" r="13" fill="#0f2d1a" stroke="#238636"/><path d="M572.0 96 l4 4 l8 -8" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="s" x="578.0" y="132" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">macOS</text>
<text class="m" x="578.0" y="152" font-size="12.5" fill="#58a6ff" text-anchor="middle">Apple silicon</text>
<text class="s" x="578.0" y="172" font-size="11.5" fill="#8b949e" text-anchor="middle">signed Mach-O · M10</text>
<rect x="662.0" y="66" width="148" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<g class="p4" style="transform-box:fill-box;transform-origin:center"><circle cx="736.0" cy="96" r="13" fill="#0f2d1a" stroke="#238636"/><path d="M730.0 96 l4 4 l8 -8" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="s" x="736.0" y="132" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">Browser</text>
<text class="m" x="736.0" y="152" font-size="12.5" fill="#58a6ff" text-anchor="middle">WebAssembly</text>
<text class="s" x="736.0" y="172" font-size="11.5" fill="#8b949e" text-anchor="middle">the compiler too</text>
<text class="s" x="28" y="226" font-size="13" fill="#8b949e">One compiler cross-builds for all five from Windows or Linux. Releases are <tspan fill="#e6edf3">byte-identical</tspan> whichever host builds them.</text>
</g>
<rect x="0.5" y="0.5" width="839" height="249" rx="12" fill="none" stroke="#30363d"/>
</svg>
